<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Citizen Compass - Arrow Hardpoint Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
  #canvas-wrap { position: absolute; inset: 0; cursor: default; }
  #canvas-wrap.hovering { cursor: pointer; }
  #hud {
    position: absolute; top: 16px; left: 16px; color: #cfd6e4;
    font-size: 13px; line-height: 1.5; background: rgba(10,12,18,0.6);
    padding: 10px 14px; border-radius: 8px; border: 1px solid #2a3040;
    max-width: 320px;
  }
  #hud b { color: #7fd0ff; }
  #hud .missile-total { color: #6fd8a0; font-weight: 600; }
  #back-link {
    position: absolute; top: 16px; right: 16px; color: #9aa4bb;
    font-size: 13px; background: rgba(10,12,18,0.6); padding: 8px 14px;
    border-radius: 8px; border: 1px solid #2a3040; text-decoration: none;
  }
  #back-link:hover { color: #7fd0ff; }
  #popup {
    position: absolute; display: none; min-width: 280px; max-width: 340px;
    background: #12151d; border: 1px solid #3a4258; border-radius: 10px;
    padding: 14px 16px; color: #e6e9f0; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    z-index: 10; max-height: 70vh; overflow-y: auto;
  }
  #popup h3 { margin: 0 0 4px 0; font-size: 15px; color: #7fd0ff; }
  #popup .type-tag {
    display: inline-block; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.05em; color: #9aa4bb; margin-bottom: 8px;
  }
  #popup .section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: #6b7488; margin-top: 12px; margin-bottom: 4px;
  }
  #popup .item-row {
    border-top: 1px solid #262c3a; padding: 8px 0; font-size: 13px;
  }
  #popup .item-row.equipped { border-top: 1px solid #2c4a5e; }
  #popup .item-name { font-weight: 600; color: #e6e9f0; }
  #popup .item-name.equipped-tag::after {
    content: " (equipped)"; color: #6fd8a0; font-weight: 400; font-size: 11px;
  }
  #popup .item-meta { color: #9aa4bb; font-size: 12px; margin-top: 2px; }
  #popup .variant-row {
    padding: 5px 0; font-size: 12.5px; color: #c3c9d6; border-top: 1px solid #1c202b;
  }
  #popup .note {
    margin-top: 10px; font-size: 11px; color: #6b7488; font-style: italic;
  }
  /* Rack configuration selector (missile hardpoints only) */
  #popup .rack-option {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; margin-top: 6px; border-radius: 6px;
    border: 1px solid #262c3a; cursor: pointer; font-size: 12.5px;
  }
  #popup .rack-option:hover { border-color: #3a4258; background: #171b26; }
  #popup .rack-option.selected {
    border-color: #6fd8a0; background: rgba(111,216,160,0.08); color: #e6e9f0;
  }
  #popup .rack-option .count { color: #7fd0ff; font-weight: 600; }
  #popup .close-btn {
    position: absolute; top: 8px; right: 10px; cursor: pointer;
    color: #6b7488; font-size: 16px; line-height: 1; pointer-events: auto;
  }
  #popup .close-btn:hover { color: #e6e9f0; }
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="hud">
  <b>Citizen Compass — Arrow Hardpoint Viewer</b><br>
  Proof of concept, 7 of 17 hardpoints placed.<br>
  Drag to orbit, scroll to zoom.<br>
  Hover a glowing marker, click to inspect.<br>
  Total missiles equipped: <span class="missile-total" id="missile-total">-</span>
</div>
<a id="back-link" href="../../index.html">&larr; Back to test index</a>
<div id="popup"></div>

<script type="importmap">
{
  "imports": {
    "three": "../../vendor/three/build/three.module.js",
    "three/addons/": "../../vendor/three/examples/jsm/"
  }
}
</script>
<script type="module">
import { createHardpointViewer } from '../../shared/hardpoint-viewer.js';

/* ---------------------------------------------------------------
   COMPATIBILITY DATA - identical to the original inline version,
   only relocated. See the original for provenance notes.
------------------------------------------------------------------ */
const HARDPOINT_INFO = {
  "weapon_turret": {
    title: "Top Turret Mount (S3)",
    equipped: [
      { name: "Anvil Arrow Turret", meta: "Turret housing, holds 2x S1 weapons" },
      { name: "YellowJacket GT-210 Gatling (x2)", meta: "Ballistic, 202 DPS each, 4k rounds" },
    ],
    variants: [
      "CF-117 Bulldog Repeater", "Deadbolt I Cannon", "Havoc Scattergun",
      "M3A Cannon", "Omnisky III Cannon", "NN-13 Cannon",
    ],
  },
  "weapon_gun": {
    title: "Wing Gun Mount (S3)",
    equipped: [
      { name: "VariPuck S3 Gimbal Mount", meta: "Gimballed weapon mount" },
      { name: "CF-337 Panther Repeater", meta: "Laser Repeater, 546 DPS, 43.7 alpha" },
    ],
    variants: [
      "'WARLORD' Cannon", "Deadbolt III Cannon", "Mantis GT-220 Gatling",
      "NN-15 Cannon", "Omnisky IX Cannon", "Dominance-3 Scattergun",
    ],
  },
};

const RACK_CONFIGS = {
  S2: [
    { id: "single_s2", label: "Single S2 rack (fixed)", count: 1, size: "S2",
      note: "This hardpoint is a fixed S2 mount - no larger or multi-missile rack fits here." },

  S3: [
    { id: "dual_s2", label: "Dual S2 rack (BEHR MRCK_S03_BEHR_Dual_S02)", count: 2, size: "S2",

createHardpointViewer({
  modelPath: 'model.glb',
  hardpointsPath: 'hardpoints.json',
  hardpointInfo: HARDPOINT_INFO,
  rackConfigs: RACK_CONFIGS,
  rackSourceLabel: "this ship's real port data (arrow_api_raw.json)",
});
</script>
</body>
</html>
