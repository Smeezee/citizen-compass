<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Citizen Compass - Cutlass Black Hardpoint Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
  #canvas-wrap { position: absolute; inset: 0; }
  #hud {
    position: absolute; top: 16px; left: 16px; color: #cfd6e4;
    font-size: 13px; line-height: 1.5; background: rgba(10,12,18,0.6);
    padding: 10px 14px; border-radius: 8px; border: 1px solid #2a3040;
    max-width: 320px;
  }
  #hud b { color: #7fd0ff; }
  #back-link {
    position: absolute; top: 16px; right: 16px; color: #9aa4bb;
    font-size: 13px; background: rgba(10,12,18,0.6); padding: 8px 14px;
    border-radius: 8px; border: 1px solid #2a3040; text-decoration: none;
  }
  #back-link:hover { color: #7fd0ff; }
  #popup {
    position: absolute; display: none; min-width: 280px; max-width: 340px;
    background: #12151d; border: 1px solid #3a4258; border-radius: 10px;
    padding: 14px 16px; color: #e6e9f0; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    pointer-events: none; z-index: 10; max-height: 70vh; overflow-y: auto;
  }
  #popup h3 { margin: 0 0 4px 0; font-size: 15px; color: #7fd0ff; }
  #popup .type-tag {
    display: inline-block; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.05em; color: #9aa4bb; margin-bottom: 8px;
  }
  #popup .note {
    margin-top: 10px; font-size: 11px; color: #6b7488; font-style: italic;
  }
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="hud">
  <b>Citizen Compass — Cutlass Black Hardpoint Viewer</b><br>
  6 hardpoints placed (missile rack, wing guns, turret).<br>
  Drag to orbit, scroll to zoom.<br>
  Click a glowing marker to inspect it.
</div>
<a id="back-link" href="../../index.html">&larr; Back to test index</a>
<div id="popup"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ---------------------------------------------------------------
   COMPATIBILITY DATA
   NOT YET POPULATED for Cutlass Black. Unlike Arrow, no equipped-item /
   variant data has been sourced or confirmed for this ship's hardpoints
   yet. Markers will render but clicking shows a "no data yet" note
   instead of equipped/variant info until this is filled in.
------------------------------------------------------------------ */
const HARDPOINT_INFO = {
  // "weapon_turret": { title: "...", equipped: [...], variants: [...] },
  // "weapon_gun": { title: "...", equipped: [...], variants: [...] },
  // "missile_rack": { title: "...", equipped: [...], variants: [...] },
};

function infoFor(hp) {
  return HARDPOINT_INFO[hp.type];
}

/* ---------------------------------------------------------------
   SCENE SETUP
------------------------------------------------------------------ */
const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d12);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(15, 10, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
wrap.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(10, 15, 8);
scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 0.6);
rim.position.set(-10, -5, -10);
scene.add(rim);

/* ---------------------------------------------------------------
   LOAD MODEL
------------------------------------------------------------------ */
const loader = new GLTFLoader();

loader.load('model.glb', (gltf) => {
  const shipMesh = gltf.scene;
  shipMesh.scale.set(0.01, 0.01, 0.01);
  shipMesh.traverse((child) => {
    if (child.isMesh) {
      child.material = new THREE.MeshStandardMaterial({
        color: 0xb8bfcc, metalness: 0.4, roughness: 0.55,
      });
    }
  });
  scene.add(shipMesh);
  loadHardpoints();
}, undefined, (err) => {
  console.error('Failed to load model.glb', err);
  document.getElementById('hud').innerHTML =
    '<b style="color:#ff7f7f">Could not load model.glb</b><br>' +
    'Serve this folder with a local server, not by double-clicking the file.';
});

/* ---------------------------------------------------------------
   LOAD HARDPOINTS + PLACE MARKERS
   Same axis conversion as Arrow: three.x = blender.x, three.y = blender.z,
   three.z = -blender.y. Not yet independently re-verified for this ship's
   model - carried over from the Arrow viewer as a starting assumption.
------------------------------------------------------------------ */
const markers = [];
const markerGeo = new THREE.SphereGeometry(0.12, 16, 16);

function loadHardpoints() {
  fetch('hardpoints.json')
    .then(r => r.json())
    .then(data => {
      data.hardpoints.forEach((hp) => {
        const info = infoFor(hp);
        const color = info ? 0x7fd0ff : 0xff5566;
        const mat = new THREE.MeshBasicMaterial({ color });
        const marker = new THREE.Mesh(markerGeo, mat);

        marker.position.set(hp.position.x, hp.position.z, -hp.position.y);
        marker.userData.hardpoint = hp;
        marker.userData.info = info;
        scene.add(marker);
        markers.push(marker);

        const ringGeo = new THREE.RingGeometry(0.16, 0.22, 24);
        const ringMat = new THREE.MeshBasicMaterial({
          color, transparent: true, opacity: 0.5, side: THREE.DoubleSide,
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.copy(marker.position);
        ring.userData.isRing = true;
        scene.add(ring);
        markers.push(ring);
      });
    })
    .catch(err => console.error('Failed to load hardpoints.json', err));
}

/* ---------------------------------------------------------------
   CLICK / HOVER INTERACTION
------------------------------------------------------------------ */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const popup = document.getElementById('popup');

function onPointerMove(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
}

function onClick(e) {
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(
    markers.filter(m => !m.userData.isRing), false
  );

  if (hits.length === 0) {
    popup.style.display = 'none';
    return;
  }

  const hp = hits[0].object.userData.hardpoint;
  const info = hits[0].object.userData.info;

  let html = `<h3>${hp.label || hp.name}</h3><span class="type-tag">${hp.type.replace(/_/g,' ')}</span>`;
  if (!info) {
    html += `<div class="note">No compatibility data wired up for this hardpoint yet.</div>`;
  }
  popup.innerHTML = html;

  popup.style.display = 'block';
  const popupWidth = 340;
  const popupEstHeight = 200;
  popup.style.left = Math.min(e.clientX + 16, window.innerWidth - popupWidth - 8) + 'px';
  popup.style.top = Math.min(e.clientY + 16, window.innerHeight - popupEstHeight - 8) + 'px';
}

window.addEventListener('pointermove', onPointerMove);
window.addEventListener('click', onClick);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------------------------------------------------------------
   RENDER LOOP
------------------------------------------------------------------ */
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.02;
  const pulse = 0.5 + Math.sin(t * 3) * 0.15;
  markers.forEach(m => {
    if (m.userData.isRing) m.material.opacity = pulse;
  });
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
