<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Keyboard First</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
 --void:#05080E;--pn:#0C131E;--pn2:#111A27;--ln:#1C2735;--ink:#EAF0F8;--mut:#8092A8;--dim:#4C5B70;
 --acc:#F2661C;--gau:#45D6C8;
 --c-flight:#4FA3E0;--c-foot:#E2574C;--c-eva:#B084E8;--c-veh:#E0A33C;--c-cam:#5FD39B;
 --c-social:#E8C84A;--c-quick:#F08FB5;--c-voip:#7FD1E8;--c-spec:#9AA6B5;--c-unc:#6E7C90;
 --fd:'Chakra Petch',ui-sans-serif,system-ui,sans-serif;--fb:'Barlow',ui-sans-serif,system-ui,sans-serif;
 --fm:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--void);color:var(--ink);font:400 15px/1.5 var(--fb);-webkit-font-smoothing:antialiased;overflow-x:hidden}
:focus-visible{outline:2px solid var(--gau);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button{font-family:inherit}

.top{display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.logo{font:700 17px/1 var(--fd);letter-spacing:.05em}
.logo b{color:var(--acc)}
.logo span{display:block;font:400 8.5px/1.6 var(--fm);color:var(--dim);letter-spacing:.2em;text-transform:uppercase;margin-top:3px}
.profile{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--pn);border:1px solid var(--ln);border-radius:3px;color:var(--mut);cursor:pointer;
 font:600 10.5px var(--fm);letter-spacing:.12em;text-transform:uppercase;padding:10px 14px}
.btn:hover{color:var(--ink);border-color:var(--dim)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#180800}
.btn.pri:hover{color:#180800}

/* control strip */
.strip{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--ln);flex-wrap:wrap;
 position:sticky;top:0;z-index:40;background:rgba(5,8,14,.96);backdrop-filter:blur(10px)}
.seg{display:flex;border:1px solid var(--ln);border-radius:3px;overflow:hidden}
.seg button{background:var(--pn);border:0;border-left:1px solid var(--ln);color:var(--mut);cursor:pointer;
 font:600 10.5px var(--fm);letter-spacing:.1em;text-transform:uppercase;padding:10px 13px;transition:.12s}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--m,#4FA3E0);color:#04080D}
.seg button:hover:not([aria-pressed=true]){color:var(--ink)}
.searchw{position:relative;flex:1 1 240px;min-width:190px}
.searchw input{width:100%;background:var(--pn);border:1px solid var(--ln);border-radius:3px;color:var(--ink);
 font:500 14px var(--fb);padding:10px 13px}
.searchw input::placeholder{color:var(--dim)}
.hits{position:absolute;left:0;right:0;top:calc(100% + 5px);background:#0A111C;border:1px solid #24324A;border-radius:3px;
 z-index:60;max-height:340px;overflow:auto}
.hits[hidden]{display:none}
.hits button{display:flex;width:100%;gap:10px;align-items:center;background:none;border:0;border-bottom:1px solid #131C29;
 color:var(--ink);cursor:pointer;font:500 13.5px var(--fb);padding:9px 12px;text-align:left}
.hits button:hover{background:#131E2C}
.hits button i{font-style:normal;margin-left:auto;font:700 11px var(--fm);color:var(--gau);white-space:nowrap}
.hits button s{text-decoration:none;color:var(--dim);font:400 11px var(--fm)}
.free{margin-left:auto}

/* the board */
.stage{padding:26px 22px 40px;display:flex;flex-direction:column;align-items:center;gap:16px}
.kb{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.block{display:flex;flex-direction:column;gap:6px}
.krow{display:flex;gap:6px}
/* --- a key that looks like a key: outer shell, bevelled skirt, inset face --- */
.key{position:relative;border:0;border-radius:7px;cursor:pointer;padding:0;
 min-width:58px;height:70px;display:block;text-align:left;
 background:linear-gradient(180deg,#26344A 0%,#1A2434 42%,#101823 100%);
 box-shadow:0 4px 0 #070B12, 0 6px 9px rgba(0,0,0,.55), 0 0 0 1px #2C3A4E inset;
 transition:transform .19s cubic-bezier(.22,.9,.28,1.25), box-shadow .26s ease,
  background .26s ease;will-change:transform}
.key .face{position:absolute;left:3px;right:3px;top:3px;bottom:6px;border-radius:5px;
 background:linear-gradient(180deg,#1E2939 0%,#161F2C 60%,#121A25 100%);
 box-shadow:0 1px 0 rgba(255,255,255,.075) inset, 0 -1px 0 rgba(0,0,0,.5) inset;
 padding:5px 6px 4px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.key .cap{font:700 10.5px var(--fm);letter-spacing:.02em;color:#7F91A8;flex:0 0 auto;line-height:1}
.key .act{font:500 8.7px/1.2 var(--fb);color:var(--ink);opacity:.96;width:100%;
 display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
 overflow-wrap:normal;hyphens:none}
.key.bound{background:linear-gradient(180deg,
   color-mix(in srgb,var(--k) 38%,#26344A) 0%,
   color-mix(in srgb,var(--k) 20%,#1A2434) 42%,
   color-mix(in srgb,var(--k) 10%,#101823) 100%);
 box-shadow:0 4px 0 color-mix(in srgb,var(--k) 22%,#070B12), 0 6px 9px rgba(0,0,0,.55),
   0 0 0 1px color-mix(in srgb,var(--k) 45%,transparent) inset}
.key.bound .face{background:linear-gradient(180deg,
   color-mix(in srgb,var(--k) 17%,#1E2939) 0%, color-mix(in srgb,var(--k) 8%,#141D29) 70%, #111925 100%)}
.key.bound .cap{color:var(--k)}
.key.multi .face::after{content:'';position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;
 background:var(--k);box-shadow:0 0 5px var(--k)}
/* bound somewhere else, not here */
.key.elsew .face::after{content:'';position:absolute;right:5px;top:5px;width:0;height:0;
 border-top:6px solid #46596F;border-left:6px solid transparent}
.key.elsew .cap{color:#5D6E85}
.elsewn{font:400 8px var(--fm);font-style:normal;color:#46596F;letter-spacing:.04em}
.key:hover{transform:translateY(-2px);box-shadow:0 6px 0 #070B12,0 10px 14px rgba(0,0,0,.6),
 0 0 0 1px var(--k,var(--gau)) inset;z-index:3}
.key:active,.key.down{transform:translateY(4px) scale(.982);
 transition:transform .055s cubic-bezier(.4,0,.6,1), box-shadow .07s ease;
 box-shadow:0 0 0 #070B12,0 1px 3px rgba(0,0,0,.6),
  0 0 0 1.5px rgba(255,255,255,.5) inset,
  0 0 0 2px var(--acc),
  0 0 12px 0 color-mix(in srgb,var(--acc) 50%,transparent),
  0 0 24px 2px color-mix(in srgb,var(--acc) 15%,transparent)}
.key.sel{z-index:6;transform:translateY(-1px);
 box-shadow:0 5px 0 #05080D,0 8px 12px rgba(0,0,0,.55),
  0 0 0 1.5px rgba(255,255,255,.5) inset,
  0 0 0 2px var(--acc),
  0 0 13px 0 color-mix(in srgb,var(--acc) 52%,transparent),
  0 0 26px 2px color-mix(in srgb,var(--acc) 16%,transparent)}
.key.sel .face{background:linear-gradient(180deg,
  color-mix(in srgb,var(--k,var(--gau)) 55%,#2A374A),
  color-mix(in srgb,var(--k,var(--gau)) 26%,#1B2532) 72%,#141C27)}
.key.sel .cap{color:#FFF}
.key.hit{animation:hit 1.4s ease}
@keyframes hit{0%,100%{box-shadow:0 4px 0 #070B12,0 6px 9px rgba(0,0,0,.55)}
 20%{box-shadow:0 4px 0 #070B12,0 0 0 5px rgba(242,102,28,.55)}}
.key.dimmed{opacity:.15}
.key.freek{background:linear-gradient(180deg,#1B4636,#12301F 45%,#0C2117)}
.key.freek .face{background:linear-gradient(180deg,#153728,#0E2419 70%,#0B1D14)}
.key.freek .cap{color:#5FD39B}
.k-w15{min-width:88px}.k-w175{min-width:102px}.k-w2{min-width:118px}.k-w225{min-width:134px}
.k-w25{min-width:148px}.k-w6{min-width:354px}
.spacer{width:26px}

/* ---- style switchers ---- */
.styles{display:flex;gap:26px;flex-wrap:wrap;padding:12px 22px;border-bottom:1px solid var(--ln);
 background:rgba(8,12,19,.6)}
.sgrp{display:flex;align-items:center;gap:9px}
.sgrp>span{font:600 9.5px var(--fm);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.stage{padding:26px 22px 60px;display:flex;flex-direction:column;align-items:center;gap:14px}
.boardcol{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.kbwrap{position:relative}
.spokes{position:absolute;inset:-260px -300px;width:calc(100% + 600px);height:calc(100% + 520px);
 pointer-events:none;overflow:visible}
.spokes path{stroke:var(--k,var(--acc));stroke-width:1;fill:none;opacity:.65}
.spokes circle{fill:var(--k,var(--acc))}
.spokes text{font:500 11px 'Barlow',sans-serif;fill:#D6E2F0}
.spokes text.s{font:400 9px 'JetBrains Mono',monospace;fill:#6C7E94}

/* ---- 1. GLASS: frosted, beside the key, never over it ---- */
.glass{position:fixed;z-index:90;pointer-events:none;width:224px;padding:11px 13px 12px;border-radius:9px;
 background:rgba(9,14,23,.40);backdrop-filter:blur(20px) saturate(1.5);
 -webkit-backdrop-filter:blur(20px) saturate(1.5);
 border:1px solid rgba(255,255,255,.10);
 box-shadow:0 18px 44px rgba(0,0,0,.45);
 opacity:0;transform:translateY(5px) scale(.985);
 transition:opacity .16s ease, transform .19s cubic-bezier(.2,.9,.3,1.1)}
.glass.on{opacity:1;transform:none}
.glass::before{content:'';position:absolute;top:11px;bottom:11px;width:2px;border-radius:2px;
 background:var(--k,var(--acc));opacity:.85}
.glass.side-r::before{left:-1px}
.glass.side-l::before{right:-1px}
@keyframes gin{from{opacity:0;transform:translateY(4px) scale(.985)}}
.glass[hidden]{display:none}
.glass h5{margin:0;font:600 13px var(--fb);color:#F4F8FC}
.glass .gsub{font:400 8.5px var(--fm);letter-spacing:.15em;text-transform:uppercase;color:#8398B0;margin:1px 0 8px}
.glass .gl{padding:6px 0;border-top:1px solid rgba(255,255,255,.07)}
.glass .gl:first-of-type{border-top:0}
.glass .gl b{display:block;font:500 11.5px/1.32 var(--fb);color:#EDF3FA}
.glass .gl i{font-style:normal;font:400 9px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--k)}
.glass .gmore{margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.055);
 font:400 10.5px var(--fm);color:#6C7E94}
.glass .gfree{color:#6FE3AE;font-size:12.5px}
.glass .gx{position:absolute;top:5px;right:6px;width:20px;height:20px;border:0;border-radius:5px;
 background:none;color:#7A8CA3;font:400 16px/1 var(--fb);cursor:pointer;pointer-events:auto}
.glass .gx:hover{background:rgba(255,255,255,.08);color:#EAF0F8}

/* ---- 2. GROW: the key itself opens. no box at all ---- */
.key.grown{z-index:70;position:absolute;width:238px;height:auto;min-height:150px;
 box-shadow:0 14px 0 #05080D,0 26px 50px rgba(0,0,0,.7),0 0 0 1px var(--k,var(--gau)) inset;
 transition:none}
.key.grown .face{position:relative;left:auto;right:auto;top:auto;bottom:auto;margin:4px 4px 10px;
 padding:12px 13px 13px;gap:8px}
.key.grown .cap{font-size:19px}
.key.grown .act{-webkit-line-clamp:unset;font:500 11.5px/1.45 var(--fb);white-space:normal}
.kb.hasgrown .key:not(.grown){opacity:.22}
.growph{position:absolute;pointer-events:none}

/* ---- 3. RIBBON: the row opens underneath ---- */
.ribbon{position:absolute;z-index:80;pointer-events:none;animation:rop .15s ease-out}
@keyframes rop{from{opacity:0;transform:translateY(-5px)}}
.ribbon .rin{margin:0;padding:12px 16px;border-radius:6px;
 background:linear-gradient(180deg,#141D2B,#0B1119);
 border:1px solid #26374A;border-left:3px solid var(--k,var(--acc));
 box-shadow:0 16px 34px rgba(0,0,0,.5);
 display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.ribbon .rk{font:700 13px var(--fm);color:var(--k,var(--acc));min-width:54px}
.ribbon .rl{min-width:180px}
.ribbon .rl b{display:block;font:500 12.5px var(--fb);color:var(--ink)}
.ribbon .rl span{font:400 10px var(--fm);color:var(--dim);letter-spacing:.1em;text-transform:uppercase}

/* ---- 4. QUIET: no box at all. the board goes quiet, the answer is just type ---- */
.kb.quiet .key:not(.sel){opacity:.07}
.kb.quiet .key.sel{opacity:1}
.quiet-say{position:absolute;z-index:85;pointer-events:none;width:300px;
 animation:qin .18s ease-out}
@keyframes qin{from{opacity:0;transform:translateY(6px)}}
.quiet-say .qk{font:700 11px var(--fm);letter-spacing:.22em;text-transform:uppercase;
 color:var(--k,var(--acc));margin-bottom:10px}
.quiet-say .ql{margin:0 0 11px}
.quiet-say .ql b{display:block;font:500 18px/1.28 var(--fb);color:#F0F6FC;letter-spacing:-.01em}
.quiet-say .ql i{font-style:normal;font:400 9.5px var(--fm);letter-spacing:.16em;
 text-transform:uppercase;color:var(--k)}
.quiet-say .qm{font:400 11px var(--fm);color:#5F718A;letter-spacing:.08em}

/* ---- key light treatments ---- */
.kb[data-g="edge"] .key.bound{background:linear-gradient(180deg,#212D40,#18212F 42%,#0E1622);
 box-shadow:0 4px 0 #070B12,0 6px 9px rgba(0,0,0,.5),
  0 0 0 1px color-mix(in srgb,var(--k) 25%,#2C3A4E) inset,
  0 0 16px 1px color-mix(in srgb,var(--k) 42%,transparent),
  0 0 34px 5px color-mix(in srgb,var(--k) 18%,transparent)}
.kb[data-g="edge"] .key.bound .face{background:linear-gradient(180deg,
  color-mix(in srgb,var(--k) 12%,#1D2736),color-mix(in srgb,var(--k) 5%,#151E2A) 68%,#121A25)}
.kb[data-g="cap"] .key.bound{background:linear-gradient(180deg,#26344A,#1A2434 42%,#101823);
 box-shadow:0 4px 0 #070B12,0 6px 9px rgba(0,0,0,.55),0 0 0 1px #2C3A4E inset}
.kb[data-g="cap"] .key.bound .face{background:linear-gradient(180deg,
  color-mix(in srgb,var(--k) 60%,#1B2534),color-mix(in srgb,var(--k) 20%,#131C27) 78%,#101822);
 box-shadow:0 1px 0 color-mix(in srgb,var(--k) 70%,transparent) inset,0 -1px 0 rgba(0,0,0,.55) inset}
.kb[data-g="under"] .key.bound{background:linear-gradient(180deg,#1D2637,#151E2A 42%,#0C131D);
 box-shadow:0 5px 0 color-mix(in srgb,var(--k) 88%,#000),
  0 11px 22px -1px color-mix(in srgb,var(--k) 85%,transparent),
  0 16px 30px -4px color-mix(in srgb,var(--k) 45%,transparent),
  0 0 0 1px #29374A inset}
.kb[data-g="under"] .key.bound .face{background:linear-gradient(180deg,#1A2432,#131B26 65%,#101822)}
.kb[data-g="under"] .key:not(.bound){box-shadow:0 4px 0 #070B12,0 6px 9px rgba(0,0,0,.5),0 0 0 1px #1E2733 inset}
/* the pressed key always wins over whatever light mode is on */
.kb[data-g] .key.sel{z-index:6;transform:translateY(-1px);
 box-shadow:0 5px 0 #05080D,0 8px 12px rgba(0,0,0,.55),
  0 0 0 1.5px rgba(255,255,255,.5) inset,
  0 0 0 2px var(--acc),
  0 0 13px 0 color-mix(in srgb,var(--acc) 52%,transparent),
  0 0 26px 2px color-mix(in srgb,var(--acc) 16%,transparent)}
.kb[data-g] .key.sel .face{background:linear-gradient(180deg,
  color-mix(in srgb,var(--k,var(--gau)) 55%,#2A374A),
  color-mix(in srgb,var(--k,var(--gau)) 26%,#1B2532) 72%,#141C27)}
.kb[data-g] .key.sel .cap{color:#FFF}
.kb[data-g] .key:active,.kb[data-g] .key.down{transform:translateY(4px) scale(.982);
 transition:transform .055s cubic-bezier(.4,0,.6,1), box-shadow .07s ease;
 box-shadow:0 0 0 #070B12,0 1px 3px rgba(0,0,0,.6),
  0 0 0 1.5px rgba(255,255,255,.5) inset,
  0 0 0 2px var(--acc),
  0 0 12px 0 color-mix(in srgb,var(--acc) 50%,transparent),
  0 0 24px 2px color-mix(in srgb,var(--acc) 15%,transparent)}

/* ---- tap vs hold ---- */
.kb .key.tapped{z-index:6;transform:translateY(0) scale(1);
 box-shadow:0 4px 0 #05080D,0 7px 11px rgba(0,0,0,.55),
  0 0 0 1.5px rgba(255,255,255,.42) inset,
  0 0 0 2px var(--acc),
  0 0 12px 0 color-mix(in srgb,var(--acc) 46%,transparent),
  0 0 24px 2px color-mix(in srgb,var(--acc) 14%,transparent);
 transition:transform .3s cubic-bezier(.18,1.5,.4,1), box-shadow .2s ease}
.kb .key.tapped .cap{color:#FFF;transition:color .3s ease}
/* one soft ring leaves the key when you let go */
.kb .key.tapped::after{content:'';position:absolute;inset:0;border-radius:7px;pointer-events:none;
 box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 45%,transparent);
 animation:ripple .52s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes ripple{
 0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 45%,transparent);opacity:1}
 100%{box-shadow:0 0 0 8px color-mix(in srgb,var(--acc) 0%,transparent);opacity:0}}
.key.holding::before{content:'';position:absolute;left:5px;bottom:8px;height:4px;width:0;
 border-radius:3px;background:linear-gradient(90deg,var(--acc),#FFD9B8);
 box-shadow:0 0 6px 0 var(--acc);z-index:8;
 animation:holdfill var(--hold,450ms) cubic-bezier(.35,0,.65,1) forwards,
  holdin .12s ease-out}
@keyframes holdin{from{opacity:0}}
@keyframes holdfill{to{width:calc(100% - 10px)}}
.chip{position:fixed;z-index:95;pointer-events:none;padding:5px 10px;border-radius:6px;
 background:rgba(9,14,23,.50);backdrop-filter:blur(16px) saturate(1.4);
 -webkit-backdrop-filter:blur(16px) saturate(1.4);
 border:1px solid rgba(255,255,255,.11);box-shadow:0 10px 26px rgba(0,0,0,.4);
 font:500 11.5px var(--fb);color:#EAF0F8;white-space:nowrap;
 display:flex;gap:9px;align-items:baseline;animation:gin .1s ease-out}
.chip[hidden]{display:none}
.chip b{color:var(--acc);font:700 11px var(--fm);letter-spacing:.06em}
.chip i{font-style:normal;color:#7E90A7;font:400 9.5px var(--fm);letter-spacing:.12em;text-transform:uppercase}

.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;padding:4px 22px 0;font-size:11.5px;color:var(--mut)}
.legend button{background:none;border:0;color:inherit;cursor:pointer;font:inherit;display:flex;gap:6px;align-items:center;padding:3px 0}
.legend button i{width:9px;height:9px;border-radius:2px;display:block}
.legend button[aria-pressed=false]{opacity:.32}
.statusline{text-align:center;color:var(--dim);font:400 11.5px var(--fm);letter-spacing:.08em;padding-bottom:6px}
.statusline b{color:var(--gau);font-weight:600}
footer{border-top:1px solid var(--ln);padding:20px 22px 46px;color:var(--dim);font-size:12px;text-align:center}

/* --- small screens: never smash the keyboard --- */
.stage{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.kb{min-width:min(100%,920px)}
@media (max-width:1100px){
  .top,.strip{padding:10px 14px;gap:10px}
  .key{min-width:46px;height:56px;border-radius:6px}
  .key .face{left:2px;right:2px;top:2px;bottom:5px;padding:4px 5px 3px}
  .key .cap{font-size:9.5px}
  .key .act{font-size:7.8px;-webkit-line-clamp:3}
  .krow{gap:4px}.block{gap:4px}.kb{gap:16px}
  .stage{padding:16px 12px 28px}
}
@media (max-width:820px){
  /* keep key proportions; scroll horizontally instead of crushing */
  .kb{flex-wrap:nowrap;justify-content:flex-start;padding-bottom:8px}
  .stage{align-items:stretch}
  .key{min-width:40px;height:50px}
  .key .act{font-size:7.2px;-webkit-line-clamp:2}
  .logo{font-size:15px}
  .btn{padding:8px 10px;font-size:9.5px}
  .searchw{flex:1 1 100%;min-width:0}
  .strip{align-items:stretch}
  .free{margin-left:0}
}
@media (max-width:520px){
  .key{min-width:34px;height:44px;border-radius:5px}
  .key .cap{font-size:8.5px}
  .key .act{display:none} /* labels via panel/search on phones; caps stay readable */
  .kb{gap:10px}
  .krow{gap:3px}
}
</style>

<div class="top">
  <div class="logo">CITIZEN <b>COMPASS</b><span>keybindings</span></div>
  <div class="profile">
    <button class="btn">Import my profile</button>

  return true;});
}
function drawStyles(){
 document.getElementById('rmode').innerHTML=RMODES.map(function(m){
  return '<button data-r="'+m[0]+'" aria-pressed="'+(rmode===m[0])+'" style="--m:var(--acc)">'+m[1]+'</button>';}).join('');
 document.getElementById('gmode').innerHTML=GMODES.map(function(m){
  return '<button data-g="'+m[0]+'" aria-pressed="'+(gmode===m[0])+'" style="--m:var(--gau)">'+m[1]+'</button>';}).join('');
 document.getElementById('hmode').innerHTML=HMODES.map(function(m){
  return '<button data-h="'+m[0]+'" aria-pressed="'+(HOLD===m[0])+'" style="--m:var(--gau)">'+m[1]+'</button>';}).join('');
}
function drawSegs(){
 document.getElementById('modes').innerHTML=MODES.map(function(m){
  return '<button data-m="'+esc(m[0])+'" aria-pressed="'+(state.mode===m[0])+'" style="--m:var('+m[2]+')">'+m[1]+'</button>';}).join('');
 document.getElementById('layers').innerHTML=LAYERS.map(function(l){
  return '<button data-l="'+l[0]+'" aria-pressed="'+(state.layer===l[0])+'" style="--m:var(--gau)">'+l[1]+'</button>';}).join('');
}
function keyEl(pid,bid,cap,w){
 if(pid==='SP') return '<div class="spacer" style="width:'+(w*58+ (w-1)*6)+'px"></div>';
 var bs=bid?forKey(bid):[], b=bs[0];
 var elsewhere = bid && !bs.length && BIND.some(function(x){return x.key===bid;});
 var cls='key'+(bs.length?' bound':'')+(bs.length>1?' multi':'')+(elsewhere?' elsew':'')
  +(state.free&&bs.length?' dimmed':'')+(state.free&&!bs.length?' freek':'')+(state.hit===pid?' hit':'');
 var wcls=w===1.5?' k-w15':w===1.75?' k-w175':w===2?' k-w2':w===2.25?' k-w225':w===2.5?' k-w25':w===6?' k-w6':'';
 var sub = b ? esc(b.label) : (elsewhere ? elsewhereNote(bid) : '');
 return '<button class="'+cls+wcls+'" data-p="'+esc(pid)+'" data-k="'+esc(bid||'')+'"'
  +(b?' style="--k:'+cvar(b.cat)+'"':'')+'>'
  +'<span class="face"><span class="cap">'+esc(cap)+'</span>'
  +'<span class="act">'+sub+'</span></span></button>';
}
function elsewhereNote(k){
 var n=BIND.filter(function(x){return x.key===k;}).length;
 return '<i class="elsewn">'+n+' more</i>';
}

function block(rows,isNum){
 return '<div class="block">'+rows.map(function(r){
  return '<div class="krow">'+r.map(function(k){
   var pid=k[0],bid=k[0],cap=k[1];
   if(pid==='SP')return keyEl('SP',null,null,k[2]);
   if(isNum&&!state.numlock&&NUMOFF[pid]){ var t=NUMOFF[pid]; bid=t[0]; cap=t[1]; }
   if(pid==='numlock')bid=null;
   return keyEl(pid,bid,cap,k[2]);
  }).join('')+'</div>';}).join('')+'</div>';
}
function draw(){
 document.getElementById('kb').innerHTML=block(ROWS)+block(NAV)+block(NUM,true);
 var shown=0,total=0;
 BIND.forEach(function(b){ if(state.mode==='*'||b.cat===state.mode){total++; if(b.layer===state.layer)shown++;} });
 var freeCount=0;
 document.querySelectorAll('#kb .key').forEach(function(el){
  var bid=el.getAttribute('data-k');
  if(el.getAttribute('data-p')==='numlock')return;
  if(!bid||!forKey(bid).length)freeCount++;});
 document.getElementById('status').innerHTML= state.free
  ? '<b>'+freeCount+'</b> keys are free on this layer · everything already taken is dimmed'
  : '<b>'+shown+'</b> bindings lit · '+(state.mode==='*'?'every category':esc(state.mode))
    +' · '+(state.layer==='none'?'no modifier held':'holding '+state.layer);
 drawSegs();
 document.getElementById('kb').setAttribute('data-g',gmode);
 if(sel){var el=document.querySelector('#kb .key[data-p="'+sel.pid+'"]');
  if(el)openCard(el,el.getAttribute('data-k')); else closeCard();}
}
function drawLegend(){
 document.getElementById('legend').innerHTML=Object.keys(CATC).map(function(c){
  return '<button data-c="'+esc(c)+'" aria-pressed="'+(!state.off[c])+'"><i style="background:var('+CATC[c]+')"></i>'
   +esc(c==='Quick Keys, Interactions, and Inner Thought'?'Quick keys':c==='VOIP, FOIP and Head Tracking'?'VOIP':
     c==='Electronic Access - Spectator'?'Spectator':c==='Social - General'?'Social':c)+'</button>';}).join('');
}


/* list where else a key is used, grouped by mode */
function cardElsewhere(list){
 var by={};
 list.forEach(function(b){ (by[b.cat]=by[b.cat]||[]).push(b); });
 return Object.keys(by).map(function(c){
  var nice=c==='Quick Keys, Interactions, and Inner Thought'?'Quick keys'
   :c==='VOIP, FOIP and Head Tracking'?'VOIP':c==='Electronic Access - Spectator'?'Spectator'
   :c==='Social - General'?'Social':c==='Uncategorised'?'Other':c;
  var n=by[c].length;
  var names=by[c].slice(0,3).map(function(b){return esc(b.label);}).join(', ');
  return '<div class="ent" style="--k:'+cvar(c)+'"><b>'+esc(nice)+' &middot; '+n+'</b>'
   +'<span>'+names+(n>3?' + '+(n-3)+' more':'')+'</span></div>';
 }).join('');
}

/* ---------- four readouts, one switch ---------- */
var RMODES=[['glass','Glass at the key'],['grow','The key opens'],['quiet','No box at all']];
var GMODES=[['fill','Filled'],['edge','Glow'],['cap','Lit cap'],['under','Underglow']];
var HMODES=[[250,'0.25s'],[450,'0.45s'],[700,'0.7s'],[1000,'1s']];
var HOLD=450;
var rmode='glass', gmode='fill', sel=null;

function niceCat(c){
 return c==='Quick Keys, Interactions, and Inner Thought'?'Quick keys'
  :c==='VOIP, FOIP and Head Tracking'?'VOIP':c==='Electronic Access - Spectator'?'Spectator'
  :c==='Social - General'?'Social':c==='Uncategorised'?'Other':c;
}
var glassT=null;
function hideGlass(){
 var g=document.getElementById('glass');
 clearTimeout(glassT);
 if(g.hidden)return;
 g.classList.remove('on');
 glassT=setTimeout(function(){g.hidden=true;g.classList.remove('side-r','side-l');g.innerHTML='';},200);
}
function clearReadouts(){
 hideGlass();
 document.getElementById('quiet').innerHTML='';
 var kb=document.getElementById('kb');
 kb.classList.remove('hasgrown','quiet');
 kb.querySelectorAll('.key.grown').forEach(function(k){
  k.classList.remove('grown');k.style.left='';k.style.top='';k.style.width='';k.style.position='';});
 kb.querySelectorAll('.growph').forEach(function(p){p.remove();});
 kb.querySelectorAll('.ribbon').forEach(function(r){r.remove();});
 kb.querySelectorAll('.key.sel').forEach(function(k){k.classList.remove('sel');});
 kb.querySelectorAll('.key.tapped').forEach(function(k){k.classList.remove('tapped');});
}
function closeCard(){clearReadouts();sel=null;hideChip();}

function bindsFor(bid){return bid?forKey(bid):[];}
function allFor(bid){return bid?BIND.filter(function(x){return x.key===bid;}):[];}

function openCard(el,bid){
 clearReadouts();
 if(!el)return;
 sel={pid:el.getAttribute('data-p'),bid:bid};
 el.classList.add('sel');
 var here=bindsFor(bid), all=allFor(bid), cap=el.querySelector('.cap').textContent;
 if(rmode==='glass')  return drawGlass(el,cap,here,all);
 if(rmode==='grow')   return drawGrow(el,cap,here,all);
 if(rmode==='quiet')  return drawQuiet(el,cap,here,all);
}

/* 1. glass, placed beside the key, never over it */
function drawGlass(el,cap,here,all){
 var g=document.getElementById('glass'), r=el.getBoundingClientRect();
 var k=here[0]?cvar(here[0].cat):'var(--acc)';
 g.style.setProperty('--k',k);
 g.innerHTML='<button class="gx" aria-label="Close">&times;</button><h5>'+esc(cap)+'</h5><div class="gsub">'
  +(state.layer==='none'?'no modifier':state.layer+' held')+' &middot; '
  +esc(state.mode==='*'?'all modes':state.mode)+'</div>'
  +(here.length? here.map(function(b){return '<div class="gl" style="--k:'+cvar(b.cat)+'"><b>'+esc(b.label)
      +'</b><i>'+esc(niceCat(b.cat))+(b.act?' &middot; '+esc(b.act):'')+'</i></div>';}).join('')
   : (all.length?'<div class="gl"><b>Nothing here.</b></div>'
      :'<div class="gl gfree"><b>This key is free.</b></div>'))
  +(all.length>here.length?'<div class="gmore">'+(all.length-here.length)+' more in other modes</div>':'');
 clearTimeout(glassT);g.hidden=false;
 var w=g.offsetWidth,h=g.offsetHeight,pad=12;
 var x, right = r.right+pad+w<innerWidth-8;
 if(right){x=r.right+pad;g.classList.add('side-r');}
 else{x=r.left-pad-w;g.classList.add('side-l');}
 if(x<8){x=Math.min(Math.max(8,r.left+r.width/2-w/2), innerWidth-w-8);
   g.classList.remove('side-r','side-l');}
 var y = Math.min(Math.max(8, r.top+r.height/2-h/2), innerHeight-h-8);
 g.style.left=x+'px';g.style.top=y+'px';
 requestAnimationFrame(function(){g.classList.add('on');});
}

/* 2. the key itself opens */
function drawGrow(el,cap,here,all){
 var kb=document.getElementById('kb'), r=el.getBoundingClientRect(), kr=kb.getBoundingClientRect();
 var ph=document.createElement('div');
 ph.className='growph';ph.style.width=r.width+'px';ph.style.height=r.height+'px';
 el.parentNode.insertBefore(ph,el);
 var k=here[0]?cvar(here[0].cat):'var(--gau)';
 el.style.setProperty('--k',k);
 el.classList.add('grown');kb.classList.add('hasgrown');
 var W=238;
 var left = Math.min(Math.max(0, r.left-kr.left + r.width/2 - W/2), kb.offsetWidth-W);
 el.style.position='absolute';el.style.left=left+'px';el.style.top=(r.top-kr.top)+'px';el.style.width=W+'px';
 el.querySelector('.act').innerHTML = here.length
  ? here.map(function(b){return '<span style="display:block;margin-bottom:7px"><b style="display:block;font-weight:600;color:#EAF0F8">'
     +esc(b.label)+'</b><i style="font-style:normal;font:400 9px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:'
     +cvar(b.cat)+'">'+esc(niceCat(b.cat))+'</i></span>';}).join('')
  : (all.length? '<span style="color:#7F91A8">Nothing here. '+(all.length)+' in other modes.</span>'
     : '<span style="color:#5FD39B">Free key.</span>');
}

/* 3. a ribbon opens under the row */
function drawRibbon(el,cap,here,all){
 var row=el.closest('.krow'), k=here[0]?cvar(here[0].cat):'var(--acc)';
 var d=document.createElement('div');d.className='ribbon';d.style.setProperty('--k',k);
 d.innerHTML='<div class="rin"><span class="rk">'+esc(cap)+'</span>'
  +(here.length? here.map(function(b){return '<span class="rl"><b>'+esc(b.label)+'</b><span>'
      +esc(niceCat(b.cat))+(b.act?' &middot; '+esc(b.act):'')+'</span></span>';}).join('')
   : (all.length?'<span class="rl"><b>Nothing in '+esc(state.mode==='*'?'this view':state.mode)
       +'</b><span>'+all.length+' in other modes</span></span>'
      :'<span class="rl"><b style="color:#5FD39B">Free key</b><span>nothing anywhere</span></span>'))
  +'</div>';
 var kb=document.getElementById('kb'), kr=kb.getBoundingClientRect(), rr=row.getBoundingClientRect();
 d.style.left='0px';d.style.width=kb.offsetWidth+'px';
 d.style.top=(rr.bottom-kr.top+7)+'px';
 kb.appendChild(d);
 if(d.offsetTop+d.offsetHeight>kb.offsetHeight)
  d.style.top=Math.max(0,(rr.top-kr.top)-d.offsetHeight-7)+'px';
}

/* 4. no box at all. the board goes quiet and the answer is just typography */
function drawQuiet(el,cap,here,all){
 var kb=document.getElementById('kb'), host=document.getElementById('quiet'),
     wrap=el.closest('.kbwrap'), wr=wrap.getBoundingClientRect(), r=el.getBoundingClientRect();
 kb.classList.add('quiet');
 var list = here.length?here:[];
 var k = list[0]?cvar(list[0].cat):'var(--gau)';
 var d=document.createElement('div');
 d.className='quiet-say';d.style.setProperty('--k',k);
 d.innerHTML='<div class="qk">'+esc(cap)+' &middot; '
  +(state.layer==='none'?'no modifier':state.layer+' held')+'</div>'
  +(list.length? list.map(function(b){return '<div class="ql" style="--k:'+cvar(b.cat)+'"><b>'
      +esc(b.label)+'</b><i>'+esc(niceCat(b.cat))+(b.act?' &middot; '+esc(b.act):'')+'</i></div>';}).join('')
   : (all.length?'<div class="ql"><b>Nothing in this view.</b><i>'+all.length+' in other modes</i></div>'
      :'<div class="ql"><b style="color:#6FE3AE">This key is free.</b><i>nothing anywhere</i></div>'))
  +'<div class="qm">'+(all.length>list.length?(all.length-list.length)+' more in other modes &middot; ':'')
  +'esc or click away to close</div>';
 host.appendChild(d);
 var W=d.offsetWidth, h=d.offsetHeight, WW=wrap.offsetWidth, H=wrap.offsetHeight, pad=24;
 var kl=r.left-wr.left, kr=r.right-wr.left, kt=r.top-wr.top;
 var left = (kr+pad+W<=WW) ? kr+pad : (kl-pad-W>=0 ? kl-pad-W : Math.min(Math.max(0,kl+r.width/2-W/2),WW-W));
 var top = Math.min(Math.max(0, kt+r.height/2-h/2), Math.max(0,H-h));
 d.style.left=left+'px';d.style.top=top+'px';
}

/* events */
document.getElementById('modes').onclick=function(e){var b=e.target.closest('button');if(!b)return;
 state.mode=b.getAttribute('data-m');state.hit=null;closeCard();draw();};
document.getElementById('layers').onclick=function(e){var b=e.target.closest('button');if(!b)return;
 state.layer=b.getAttribute('data-l');state.hit=null;closeCard();draw();};
document.getElementById('numbtn').onclick=function(){setNumlock(!state.numlock);};
document.getElementById('freebtn').onclick=function(){state.free=!state.free;
 this.setAttribute('aria-pressed',state.free);this.textContent=state.free?'Show bindings':'Show free keys';closeCard();draw();};
document.getElementById('legend').onclick=function(e){var b=e.target.closest('button');if(!b)return;
 var c=b.getAttribute('data-c');state.off[c]=!state.off[c];drawStyles();drawLegend();draw();
document.getElementById('rmode').onclick=function(e){var b=e.target.closest('button');if(!b)return;
 rmode=b.getAttribute('data-r');drawStyles();var s0=sel;closeCard();
 if(s0){var el=document.querySelector('#kb .key[data-p="'+s0.pid+'"]');if(el)openCard(el,el.getAttribute('data-k'));}};
document.getElementById('gmode').onclick=function(e){var b=e.target.closest('button');if(!b)return;
 gmode=b.getAttribute('data-g');drawStyles();draw();};};
/* ---------- tap = highlight. hold = open. ---------- */
var holdT=null, holdEl=null, chipT=null;
function chipFor(el,bid){
 var c=document.getElementById('chip'), r=el.getBoundingClientRect();
 var here=bindsFor(bid), all=allFor(bid), cap=el.querySelector('.cap').textContent;
 var what = here.length? here[0].label + (here.length>1?'  +'+(here.length-1)+' more':'')
   : (all.length? all.length+' binding'+(all.length>1?'s':'')+' in other modes' : 'free key');
 c.innerHTML='<b>'+esc(cap)+'</b><span>'+esc(what)+'</span><i>hold to open</i>';
 c.hidden=false;
 var w=c.offsetWidth,h=c.offsetHeight;
 var x=Math.min(Math.max(8, r.left+r.width/2-w/2), innerWidth-w-8);
 var y=r.top-h-9; if(y<8) y=r.bottom+9;
 c.style.left=x+'px';c.style.top=y+'px';
 clearTimeout(chipT);
}
function hideChip(){var c=document.getElementById('chip');c.hidden=true;c.innerHTML='';}
function cancelHold(){
 if(holdT){clearTimeout(holdT);holdT=null;}
 if(holdEl){holdEl.classList.remove('down','holding');holdEl=null;}
}
function beginHold(el){
 if(!el)return;
 cancelHold();
 if(sel){closeCard();}
 holdEl=el;
 el.classList.add('down','holding');
 el.style.setProperty('--hold',HOLD+'ms');
 chipFor(el,el.getAttribute('data-k'));
 holdT=setTimeout(function(){
  holdT=null;
  el.classList.remove('holding');
  hideChip();
  openCard(el,el.getAttribute('data-k'));
  el.classList.remove('down');
  holdEl=null;
 },HOLD);
}
var tapT=null;
function releaseHold(){
 if(holdT){ /* let go early: it was a tap. highlight it, name it, then fade */
  clearTimeout(holdT);holdT=null;
  var t=holdEl;
  document.querySelectorAll('.key.tapped').forEach(function(x){x.classList.remove('tapped');});
  if(t)t.classList.add('tapped');
  clearTimeout(chipT);clearTimeout(tapT);
  chipT=setTimeout(hideChip,1000);
  tapT=setTimeout(function(){if(t)t.classList.remove('tapped');},850);
 }
 if(holdEl){holdEl.classList.remove('down','holding');holdEl=null;}
}
document.getElementById('kb').addEventListener('mousedown',function(e){
 var b=e.target.closest('.key');
 if(!b){closeCard();return;}
 e.preventDefault();
 beginHold(b);
});
addEventListener('mouseup',releaseHold);
document.getElementById('kb').addEventListener('mouseleave',releaseHold);
/* click anywhere off a key or the card closes it; esc closes it */
document.addEventListener('mousedown',function(e){
 if(e.target.closest('#kb .key')||e.target.closest('.glass')||e.target.closest('.quiet-say'))return;
 if(sel)closeCard();});
document.getElementById('glass').onclick=function(e){if(e.target.closest('.gx'))closeCard();};


var inp=document.getElementById('q'),hits=document.getElementById('hits');
inp.oninput=function(){
 var v=inp.value.trim().toLowerCase();
 if(v.length<2){hits.hidden=true;return;}
 var m=BIND.filter(function(b){return (b.label+' '+b.sec+' '+b.cat).toLowerCase().indexOf(v)>-1;}).slice(0,10);
 hits.innerHTML=m.length?m.map(function(b,i){
  return '<button data-i="'+i+'">'+esc(b.label)+' <s>'+esc(b.cat)+'</s><i>'
   +(b.layer!=='none'?b.layer.toUpperCase()+' + ':'')+b.key.toUpperCase()+'</i></button>';}).join('')
  :'<button disabled style="color:var(--dim)">Nothing matches that</button>';
 hits._m=m;hits.hidden=false;
};
hits.onclick=function(e){var b=e.target.closest('button');if(!b||!hits._m)return;
 var t=hits._m[+b.getAttribute('data-i')];
 state.mode=t.cat;state.layer=t.layer;state.hit=null;state.free=false;
 document.getElementById('freebtn').setAttribute('aria-pressed',false);
 document.getElementById('freebtn').textContent='Show free keys';
 hits.hidden=true;inp.value='';draw();
 var el=document.querySelector('#kb .key[data-k="'+t.key+'"]');
 if(el){state.hit=el.getAttribute('data-p');draw();
  el=document.querySelector('#kb .key[data-p="'+state.hit+'"]');
  el.scrollIntoView({block:'center',behavior:'smooth'});
  setTimeout(function(){openCard(el,t.key);},380);}
};
document.addEventListener('click',function(e){if(!e.target.closest('.searchw'))hits.hidden=true;});

/* live key press - read the PHYSICAL key (e.code), never the character.
   numpad 4 and top-row 4 both report "4"; only e.code tells them apart. */
var CODE={
 Escape:'esc',Backquote:'grave',Minus:'minus',Equal:'equals',Backspace:'backspace',
 Tab:'tab',BracketLeft:'lbracket',BracketRight:'rbracket',Backslash:'backslash',
 CapsLock:'capslock',Semicolon:'semicolon',Quote:'apostrophe',Enter:'enter',
 ShiftLeft:'lshift',ShiftRight:'rshift',Comma:'comma',Period:'period',Slash:'slash',
 ControlLeft:'lctrl',ControlRight:'rctrl',AltLeft:'lalt',AltRight:'ralt',Space:'space',
 ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
 Insert:'insert',Delete:'delete',Home:'home',End:'end',PageUp:'pgup',PageDown:'pgdn',
 NumLock:'numlock',NumpadDivide:'np_divide',NumpadMultiply:'np_multiply',
 NumpadSubtract:'np_subtract',NumpadAdd:'np_add',NumpadEnter:'np_enter',NumpadDecimal:'np_period'
};
'0123456789'.split('').forEach(function(d){CODE['Digit'+d]=d;CODE['Numpad'+d]='np_'+d;});
'abcdefghijklmnopqrstuvwxyz'.split('').forEach(function(c){CODE['Key'+c.toUpperCase()]=c;});
for(var fi=1;fi<=12;fi++)CODE['F'+fi]='f'+fi;

/* CODE gives the PHYSICAL key id, which is unique on the board.
   The binding shown on it is whatever that element currently carries. */
function setNumlock(v){
 state.numlock=v;
 var nb=document.getElementById('numbtn');
 nb.setAttribute('aria-pressed',v);nb.textContent='Num Lock: '+(v?'on':'off');
 closeCard();draw();
}
addEventListener('keydown',function(e){
 if(e.target.tagName==='INPUT')return;
 if(e.key==='Escape'){e.preventDefault();closeCard();return;}
 if(e.code==='NumLock'){e.preventDefault();setNumlock(!state.numlock);return;}
 var want=e.shiftKey?'shift':e.altKey?'alt':e.ctrlKey?'ctrl':'none';
 if(want!==state.layer){state.layer=want;draw();}
 var pid=CODE[e.code];
 if(!pid)return;
 var el=document.querySelector('#kb .key[data-p="'+pid+'"]');
 if(el){e.preventDefault();
  if(e.repeat)return;
  beginHold(el);}
});
addEventListener('keyup',function(e){
 releaseHold();
 document.querySelectorAll('.key.down').forEach(function(x){x.classList.remove('down');});
 if(!e.shiftKey&&!e.altKey&&!e.ctrlKey&&state.layer!=='none'){state.layer='none';draw();}
});

drawStyles();drawLegend();draw();
document.getElementById('rmode').onclick=function(e){var b=e.target.closest('button');if(!b)return;
 rmode=b.getAttribute('data-r');drawStyles();var s0=sel;closeCard();
 if(s0){var el=document.querySelector('#kb .key[data-p="'+s0.pid+'"]');if(el)openCard(el,el.getAttribute('data-k'));}};
document.getElementById('gmode').onclick=function(e){var b=e.target.closest('button');if(!b)return;
 gmode=b.getAttribute('data-g');drawStyles();draw();};
document.getElementById('hmode').onclick=function(e){var b=e.target.closest('button');if(!b)return;
 HOLD=+b.getAttribute('data-h');drawStyles();};
})();
</script>
